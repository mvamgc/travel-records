[workspace]
resolver = "3"
members = ["crates/shared", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
shared = { path = "crates/shared" }

# Server
axum = "0.8.9"
lambda_http = "1.3.2"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Client
console_error_panic_hook = "0.1.7"
# 0.6, the version server_fn (via leptos) already pulls in, so only one is built.
gloo-net = { version = "0.6.0", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8.22", features = ["csr"] }
web-sys = { version = "0.3.106", features = ["Navigator", "ServiceWorkerContainer"] }

# Both
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Tests
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
