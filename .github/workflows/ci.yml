name: CI

# Pull request checks of ADR-0005 decision 6. Docs-only changes are left to docs.yml.
on:
  pull_request:
    paths-ignore: ["docs/**", "**.md", "book.toml", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md", "book.toml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude client --all-targets -- -D warnings
      - run: cargo clippy -p client --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --exclude client

  web:
    name: PWA build, infra tests and synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          web: true
      - name: Build the PWA
        working-directory: crates/client
        run: trunk build --release
      - name: Infra tests
        working-directory: infra
        run: npx jest
      - name: Synthesize all stacks (builds the Lambda binaries for arm64)
        working-directory: infra
        run: npx cdk synth --all --quiet

  # Shows what a merge would change in dev. Skipped until the CI stack's roles
  # exist and AWS_DIFF_ROLE_DEV is set (infra/README.md), and for pull requests
  # from forks, which get no OIDC token.
  diff:
    name: cdk diff against dev
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_DIFF_ROLE_DEV != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          web: true
      - name: Build the PWA
        working-directory: crates/client
        run: trunk build --release
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_DEV }}
          aws-region: us-east-1
      - name: Diff
        working-directory: infra
        run: npx cdk diff TravelRecords-dev
